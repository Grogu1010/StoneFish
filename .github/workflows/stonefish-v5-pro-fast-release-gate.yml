name: Stonefish v5 Pro fast release gate

on:
  push:
    branches:
      - chatgpt/v5-pro-release-candidate
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - '.github/workflows/stonefish-v5-pro-fast-release-gate.yml'

concurrency:
  group: stonefish-v5-pro-fast-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v5-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start: [0, 20, 40, 60, 80]
    env:
      GAMES: '20'
      START_INDEX: ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require 20-0-0 and Pro no slower than v5
        run: node benchmark_v5_pro.js

  release-gate:
    needs: v5-release
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release gate
        run: |
          echo "Stonefish v5 Pro fast release gate passed: 100-0-0 vs v5 and no slower than v5."
