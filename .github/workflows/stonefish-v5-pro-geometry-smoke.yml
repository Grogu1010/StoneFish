name: Stonefish v5 Pro confidence-blend extended smoke

on:
  push:
    branches:
      - chatgpt/v5-pro-confidence-extended
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_head_to_head.js'
      - '.github/workflows/stonefish-v5-pro-geometry-smoke.yml'

concurrency:
  group: stonefish-v5-pro-confidence-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '4'
      START_INDEX: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require confidence-blend Pro lossless and no slower than v5 on games 5-8
        run: node benchmark_v5_pro.js

  old-pro-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H2H_GAMES: '2'
      START_INDEX: '2'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Checkout released Pro reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play confidence-blend candidate vs released Pro on games 3-4
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_v5_pro_head_to_head.js
