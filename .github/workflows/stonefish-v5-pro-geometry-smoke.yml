name: Stonefish v5 Pro root-trust 20-game v5 gate

on:
  push:
    branches:
      - chatgpt/v5-pro-root-trust-v5-20
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - '.github/workflows/stonefish-v5-pro-geometry-smoke.yml'

concurrency:
  group: stonefish-v5-pro-root-trust-v5-20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v5-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '20'
      START_INDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require root-trust Pro release-band strength and no slower than v5
        run: node benchmark_v5_pro.js
