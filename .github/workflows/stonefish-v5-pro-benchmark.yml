name: Stonefish v5 Pro benchmark

on:
  push:
    branches:
      - chatgpt/stonefish-v5-pro-speed
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_regression.js'
      - '.github/workflows/stonefish-v5-pro-benchmark.yml'
  pull_request:
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_regression.js'

concurrency:
  group: stonefish-v5-pro-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  released-parity:
    name: exact released-Pro move parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARITY_GAMES: '2'
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
      - name: Checkout released main reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact move-for-move parity with released Pro
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_v5_pro_regression.js

  speed-strength-smoke:
    name: v5-speed and strength smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '4'
      START_INDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Pro no slower than v5 and no strength regression
        run: node benchmark_v5_pro.js
