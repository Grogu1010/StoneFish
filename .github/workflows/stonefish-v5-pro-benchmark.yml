name: Stonefish v5 Pro benchmark

on:
  push:
    branches:
      - chatgpt/stonefish-v5-pro-speed
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - '.github/workflows/stonefish-v5-pro-benchmark.yml'
  pull_request:
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'

concurrency:
  group: stonefish-v5-pro-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-pro:
    name: fast Pro diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '2'
      START_INDEX: '0'
      DEBUG_GAME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fast Pro line
        run: node benchmark_v5_pro.js

  reference-pro:
    name: released 100-0 Pro reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '2'
      START_INDEX: '0'
      DEBUG_GAME: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run released Pro line
        run: node benchmark_v5_pro.js
