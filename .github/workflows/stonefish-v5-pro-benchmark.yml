name: Stonefish v5 Pro benchmark

on:
  push:
    branches:
      - chatgpt/stonefish-v5-pro-speed
      - 'chatgpt/stonefish-speed-pass*'
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_runtime_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'Stonefish_ui_speed_patch.js'
      - 'index.html'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_head_to_head.js'
      - 'benchmark_v5_pro_regression.js'
      - 'benchmark_runtime_parity.js'
      - 'benchmark_ui_move_apply.js'
      - '.github/workflows/stonefish-v5-pro-benchmark.yml'
  pull_request:
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_runtime_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'Stonefish_ui_speed_patch.js'
      - 'index.html'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_head_to_head.js'
      - 'benchmark_v5_pro_regression.js'
      - 'benchmark_runtime_parity.js'
      - 'benchmark_ui_move_apply.js'
      - '.github/workflows/stonefish-v5-pro-benchmark.yml'

concurrency:
  group: stonefish-v5-pro-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-move-apply-parity:
    name: UI known-move apply parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare direct raw apply with Chess.move
        run: node benchmark_ui_move_apply.js

  speed-strength-smoke:
    name: v5 speed + strength smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '4'
      START_INDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Pro no slower than v5 and lossless vs v5
        run: node benchmark_v5_pro.js

  direct-model-parity:
    name: v3-v5 Pro direct parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout optimized candidate
        uses: actions/checkout@v4
      - name: Checkout released production reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare every optimized model on identical positions
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_runtime_parity.js

  runtime-parity:
    name: exact released-trace parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARITY_GAMES: '2'
    steps:
      - name: Checkout optimized candidate
        uses: actions/checkout@v4
      - name: Checkout released production reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact move-for-move parity
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_v5_pro_regression.js

  released-pro-smoke:
    name: candidate vs released Pro smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H2H_GAMES: '2'
      START_INDEX: '0'
    steps:
      - name: Checkout candidate Pro
        uses: actions/checkout@v4
      - name: Checkout released Pro reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play honest candidate vs released Pro smoke match
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_v5_pro_head_to_head.js
