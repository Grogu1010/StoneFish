name: Stonefish v5 Pro benchmark

on:
  push:
    branches:
      - chatgpt/stonefish-v5-pro-speed
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_head_to_head.js'
      - '.github/workflows/stonefish-v5-pro-benchmark.yml'
  pull_request:
    paths:
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_pro_head_to_head.js'

concurrency:
  group: stonefish-v5-pro-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed-strength-smoke:
    name: v5-speed and strength smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '4'
      START_INDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Pro no slower than v5 and no strength regression
        run: node benchmark_v5_pro.js

  released-pro-head-to-head:
    name: released Pro H2H shard ${{ matrix.start }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        start: [0, 20, 40, 60, 80]
    env:
      H2H_GAMES: '20'
      START_INDEX: ${{ matrix.start }}
      H2H_RESULT_FILE: h2h-${{ matrix.start }}.json
    steps:
      - name: Checkout candidate Pro
        uses: actions/checkout@v4
      - name: Checkout released Pro reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play honest candidate vs released Pro games
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_v5_pro_head_to_head.js
      - name: Upload shard summary
        uses: actions/upload-artifact@v4
        with:
          name: h2h-${{ matrix.start }}
          path: h2h-${{ matrix.start }}.json

  released-pro-aggregate:
    name: require 51 wins out of 100 vs released Pro
    needs: released-pro-head-to-head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h2h-*
          path: h2h-results
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aggregate the honest 100-game result
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'h2h-results';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
          const total = { games: 0, newWins: 0, newLosses: 0, draws: 0 };
          for (const file of files) {
            const s = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            total.games += s.games;
            total.newWins += s.newWins;
            total.newLosses += s.newLosses;
            total.draws += s.draws;
          }
          console.log('STONEFISH_V5_PRO_H2H_AGGREGATE ' + JSON.stringify(total));
          if (total.games !== 100) throw new Error(`Expected 100 games, got ${total.games}`);
          if (total.newWins < 51) throw new Error(`Candidate is not better than released Pro: ${total.newWins} wins; need at least 51.`);
          NODE
