name: Stonefish model latency

on:
  push:
    branches:
      - 'chatgpt/stonefish-speed-pass-9'
    paths:
      - 'benchmark_model_latency.js'
      - 'benchmark_fast_moves_parity.js'
      - '.github/workflows/stonefish-model-latency.yml'
      - 'Stonefish*.js'
  pull_request:
    paths:
      - 'benchmark_model_latency.js'
      - 'benchmark_fast_moves_parity.js'
      - '.github/workflows/stonefish-model-latency.yml'
      - 'Stonefish*.js'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Checkout released main
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare exact legal moves and same-run speed
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node benchmark_fast_moves_parity.js

  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure v1 through v5 Pro latency
        run: node benchmark_model_latency.js
