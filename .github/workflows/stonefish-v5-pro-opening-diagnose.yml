name: Stonefish v5 Pro fast vs full-search diagnostics

on:
  push:
    branches:
      - chatgpt/v5-pro-full-search-diagnose
    paths:
      - 'diagnose_v5_pro_opening_divergence.js'
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - '.github/workflows/stonefish-v5-pro-opening-diagnose.yml'

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        opening: [1, 2]
        color: [white, black]
    name: full-search opening ${{ matrix.opening }} ${{ matrix.color }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENING_INDEX: ${{ matrix.opening }}
      DIAG_COLOR: ${{ matrix.color }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Checkout released Pro reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: reference
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare fast and released full-search scores at first divergence
        run: REFERENCE_DIR="$GITHUB_WORKSPACE/reference" node diagnose_v5_pro_opening_divergence.js
