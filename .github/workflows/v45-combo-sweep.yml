name: v45-combo-sweep
on:
  push:
    branches: [v45-safety-rebuild]
    paths:
      - 'tools/v45-combo-sweep.js'
      - '.github/workflows/v45-combo-sweep.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/v45-combo-sweep.js
