name: Stonefish v5 opening inheritance gate

on:
  push:
    branches:
      - chatgpt/v5-opening-inheritance
    paths:
      - 'Stonefish_v5_opening_inheritance_patch.js'
      - 'Stonefish_v5.js'
      - 'Stonefish_v5_pro.js'
      - 'Stonefish_v5_pro_speed_patch.js'
      - 'Stonefish_v5_pro_geometry_patch.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'index.html'
      - 'test-worker.js'
      - 'benchmark_v5.js'
      - 'benchmark_v5_pro.js'
      - 'benchmark_v5_opening_inheritance.js'
      - '.github/workflows/stonefish-v5-opening-inheritance.yml'

concurrency:
  group: stonefish-v5-opening-inheritance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opening-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require faithful profile-0 opening inheritance
        run: node benchmark_v5_opening_inheritance.js

  v5-release-regression:
    needs: opening-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require v5 to retain 100 percent vs v4.5
        run: node benchmark_v5.js

  pro-release-regression:
    needs: opening-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start: [0, 20, 40, 60, 80]
    env:
      GAMES: '20'
      START_INDEX: ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Pro 20-0-0 and no slower than v5
        run: node benchmark_v5_pro.js
