name: Delayed causal scale coarse sweep

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: delayed-scale-coarse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Verify contracts
        run: |
          node --check ARMX/ARMX-preview.js
          node --check ARMX/ARMX.js
          node tests/kernel_contract.js
          node tests/armx_contract.js
          node tests/armx_reply_policy.js
          node tests/native_contract.js

  sweep:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        scale: [100, 150, 202, 300, 400, 600, 800]
        start: [0, 100, 200, 300, 400, 500]
    name: delayed scale ${{ matrix.scale }} start ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set delayed causal decision scale
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          scale="${{ matrix.scale }}"
          s,n=re.subn(r"const ARMX_CAUSAL_DECISION_SCALE=\d+;",f"const ARMX_CAUSAL_DECISION_SCALE={scale};",s,count=1)
          if n != 1:
              raise SystemExit("causal decision scale constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run 100-game paired block
        env:
          GAMES: '100'
          START_INDEX: '${{ matrix.start }}'
          MATCHUP: 'artemisVsCurrent'
          RESULT_JSON: result-${{ matrix.scale }}-${{ matrix.start }}.json
        run: node tests/v5_5_range.js
