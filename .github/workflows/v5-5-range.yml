name: Pre-causal Full ARMX extended baseline

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: precausal-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Verify contracts
        run: |
          node --check ARMX/ARMX-preview.js
          node --check ARMX/ARMX.js
          node tests/kernel_contract.js
          node tests/armx_contract.js
          node tests/armx_reply_policy.js
          node tests/native_contract.js

  baseline:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        start: [100, 200, 300, 400, 500]
    name: baseline start ${{ matrix.start }} — 100 games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run disjoint 100-game baseline block
        env:
          GAMES: '100'
          START_INDEX: '${{ matrix.start }}'
          MATCHUP: 'artemisVsCurrent'
          RESULT_JSON: result-baseline-${{ matrix.start }}.json
        run: node tests/v5_5_range.js
