name: Full ARMX confidence 0.07-0.09 holdouts

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: causal-confidence-007-009-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        confidence: ['0.07', '0.08', '0.09']
        start: [200, 300]
    name: confidence ${{ matrix.confidence }} — holdout ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set causal confidence threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          value="${{ matrix.confidence }}"
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_CONFIDENCE=[0-9.]+;",f"const ARMX_CAUSAL_MIN_CONFIDENCE={value};",s,count=1)
          if n != 1:
              raise SystemExit("confidence constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run candidate holdout
        env:
          GAMES: '100'
          START_INDEX: '${{ matrix.start }}'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
