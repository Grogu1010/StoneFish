name: Full ARMX causal signal wide sweep

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: causal-signal-wide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signal-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        signal: ['0.15', '0.20', '0.25', '0.30', '0.35', '0.40', '0.45', '0.50', '0.55', '0.60']
    name: signal ${{ matrix.signal }} — 100 games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set causal signal threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          value="${{ matrix.signal }}"
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_SIGNAL=[0-9.]+;",f"const ARMX_CAUSAL_MIN_SIGNAL={value};",s,count=1)
          if n != 1:
              raise SystemExit("signal constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run 100-game Artemis strength test
        env:
          GAMES: '100'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
