name: Causal confidence holdout

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: confidence-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        confidence: ['0.04','0.10','0.11','0.12']
    name: confidence ${{ matrix.confidence }} — fresh 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set confidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          value="${{ matrix.confidence }}"
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_CONFIDENCE=[0-9.]+;",f"const ARMX_CAUSAL_MIN_CONFIDENCE={value};",s,count=1)
          if n != 1: raise SystemExit("confidence constant not found")
          p.write_text(s)
          PY
      - name: Build
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run fresh holdout
        env:
          GAMES: '100'
          START_INDEX: '200'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
