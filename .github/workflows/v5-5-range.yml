name: Stonefish v5.5 Full ARMX range

on:
  pull_request:
    paths:
      - 'ARMX.js'
      - 'Stonefish_v5_5_range.js'
      - 'Stonefish_v5_5_native.js'
      - 'benchmark_v5_5_range.js'
      - 'benchmark_v5_5_armx_decomposition.js'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: v55-range-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  range-matchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        matchup:
          - athenaVsCurrent
          - aresVsCurrent
          - artemisVsCurrent
          - aresVsAthena
          - artemisVsAthena
          - artemisVsAres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled ARMX search
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Syntax check Full ARMX range
        run: |
          node --check ARMX.js
          node --check Stonefish_v5_5_range.js
          node --check benchmark_v5_5_range.js
      - name: Run matchup
        env:
          GAMES: '8'
          MATCHUP: ${{ matrix.matchup }}
        run: node benchmark_v5_5_range.js

  armx-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled ARMX search
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Syntax check decomposition
        run: node --check benchmark_v5_5_armx_decomposition.js
      - name: Run Artemis decomposition
        env:
          GAMES: '8'
        run: node benchmark_v5_5_armx_decomposition.js
