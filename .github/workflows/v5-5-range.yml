name: Stonefish v5.5 Full ARMX range

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'app.js'
      - 'index.html'
      - 'test-worker.js'
      - 'build_v5_5_kernel.cjs'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: v55-range-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Check active files
        run: |
          node --check ARMX/ARMX-preview.js
          node --check ARMX/ARMX.js
          for f in models/*.js; do node --check "$f"; done
          node --check app.js
          node --check test-worker.js
          for f in tests/*.js; do node --check "$f"; done
      - name: Verify v5.5 kernel contract
        run: node tests/kernel_contract.js
      - name: Verify Full ARMX contracts
        run: |
          node tests/armx_contract.js
          node tests/armx_reply_policy.js
          node tests/native_contract.js
      - name: Run saved-best range screen
        env:
          GAMES: '100'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
