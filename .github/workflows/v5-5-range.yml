name: Full ARMX causal observed-plies sweep

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: causal-observed-plies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        plies: [0, 4, 8, 12, 16, 20, 24]
    name: observed plies ${{ matrix.plies }} — 100 games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set causal observed-ply gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          value="${{ matrix.plies }}"
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_OBSERVED_PLIES=\d+;",f"const ARMX_CAUSAL_MIN_OBSERVED_PLIES={value};",s,count=1)
          if n != 1:
              raise SystemExit("observed-plies constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run 100-game Artemis strength test
        env:
          GAMES: '100'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
