name: Full ARMX trajectory A/B

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: causal-trajectory-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: ['pre04','pre15','traj04','traj15']
        start: [600,700]
    name: ${{ matrix.variant }} — block ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(matrix.variant, 'pre') && 'd6f5e9d0536a56b6705f7728372820e106bc8c23' || '92d0e311a2d7073dfa5fb0dbbc4da8e4fb245475' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set signal threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          variant="${{ matrix.variant }}"
          value="0.15" if variant.endswith("15") else "0.04"
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_SIGNAL=[0-9.]+;",f"const ARMX_CAUSAL_MIN_SIGNAL={value};",s,count=1)
          if n != 1:
              raise SystemExit("signal constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run 100-game Artemis test
        env:
          GAMES: '100'
          START_INDEX: '${{ matrix.start }}'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
