name: Full ARMX signal 0.15 holdout

on:
  pull_request:
    paths:
      - 'ARMX/**'
      - 'models/**'
      - 'tests/**'
      - 'build_v5_5_kernel.cjs'
      - 'native/**'
      - '.github/workflows/v5-5-range.yml'
  workflow_dispatch:

concurrency:
  group: causal-signal-015-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: ['main', 'signal015']
        start: [400, 500]
    name: ${{ matrix.variant }} — holdout ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set signal threshold for candidate
        if: matrix.variant == 'signal015'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("ARMX/ARMX.js")
          s=p.read_text()
          s,n=re.subn(r"const ARMX_CAUSAL_MIN_SIGNAL=[0-9.]+;","const ARMX_CAUSAL_MIN_SIGNAL=0.15;",s,count=1)
          if n != 1:
              raise SystemExit("signal constant not found exactly once")
          p.write_text(s)
          PY
      - name: Build compiled v5.5 kernel
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Run holdout
        env:
          GAMES: '100'
          START_INDEX: '${{ matrix.start }}'
          MATCHUP: 'artemisVsCurrent'
        run: node tests/v5_5_range.js
