name: StoneFish v6.1 validation

concurrency:
  group: stonefish-v6-1-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'models/v6.js'
      - 'models/v6_1.js'
      - 'app.js'
      - 'index.html'
      - 'test-worker.js'
      - 'tests/v6_1_engine.test.js'
      - 'benchmarks/v6_1_benchmark.cjs'
      - 'benchmarks/v6_1_match.cjs'
      - 'benchmarks/v6_1_native_probe.cjs'
      - 'package.json'
      - '.github/workflows/v6-1-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'models/v6.js'
      - 'models/v6_1.js'
      - 'app.js'
      - 'index.html'
      - 'test-worker.js'
      - 'tests/v6_1_engine.test.js'
      - 'benchmarks/v6_1_benchmark.cjs'
      - 'benchmarks/v6_1_match.cjs'
      - 'package.json'
      - '.github/workflows/v6-1-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run lint && node -c benchmarks/v6_1_benchmark.cjs && node -c benchmarks/v6_1_match.cjs && node -c benchmarks/v6_1_native_probe.cjs
      - name: v6 and v6.1 regression tests
        run: node --test tests/v6_engine.test.js tests/v6_1_engine.test.js
      - name: Matched-depth performance benchmark
        run: node benchmarks/v6_1_benchmark.cjs
      - name: v6 versus v6.1 head-to-head match
        run: node benchmarks/v6_1_match.cjs
      - name: Compiled kernel strength and speed probe
        run: node benchmarks/v6_1_native_probe.cjs
