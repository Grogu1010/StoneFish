name: v45-balance-sweep
on:
  push:
    branches: ['v45-balance-tuning']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/v45-balance-sweep.js
