name: Stonefish v5 benchmark

on:
  push:
    branches:
      - chatgpt/stonefish-v5
  pull_request:
    paths:
      - 'Stonefish_v5.js'
      - 'Stonefish_v5_tuning_patch.js'
      - 'Stonefish_v4_5*.js'
      - 'Stonefish_v4.js'
      - 'Stonefish_v3.js'
      - 'StonefishChess.js'
      - 'benchmark_v5.js'

concurrency:
  group: stonefish-v5-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 20-game v5 vs v4.5 validation
        run: node benchmark_v5.js
