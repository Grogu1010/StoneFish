name: Stonefish v5.5 testunit1 dev

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'ARMX-preview.js'
      - 'Stonefish_v5_5_search.js'
      - 'Stonefish_v5_5_native.js'
      - 'benchmark_v5_5_native_contract.js'
      - 'benchmark_v5_5_kernel_contract.js'
      - 'native/v5_5_helpers.c'
      - 'build_v5_5_kernel.cjs'
      - 'benchmark_armx_contract.js'
      - 'benchmark_armx_reply_policy.js'
      - 'Stonefish_v5_5_refutation_guard.js'
      - 'Stonefish_v5_5_testunit1.js'
      - 'Stonefish_v5_5_testunit1_dev_ui.js'
      - 'test-worker.js'
      - 'Stonefish_parallel_tests.js'
      - 'benchmark_v5_5_testunit1.js'
      - 'benchmark_v5_5_teacher.js'
      - 'benchmark_armx_preview.js'
      - 'benchmark_armx_browser.html'
      - 'benchmark_armx_browser_ci.js'
      - 'DEV_V5_5_TESTUNIT1.md'
      - '.github/workflows/v5-5-testunit1.yml'
  pull_request:
    paths:
      - 'ARMX-preview.js'
      - 'Stonefish_v5_5_search.js'
      - 'Stonefish_v5_5_native.js'
      - 'benchmark_v5_5_native_contract.js'
      - 'benchmark_v5_5_kernel_contract.js'
      - 'native/v5_5_helpers.c'
      - 'build_v5_5_kernel.cjs'
      - 'benchmark_armx_contract.js'
      - 'benchmark_armx_reply_policy.js'
      - 'Stonefish_v5_5_refutation_guard.js'
      - 'Stonefish_v5_5_testunit1.js'
      - 'Stonefish_v5_5_testunit1_dev_ui.js'
      - 'test-worker.js'
      - 'Stonefish_parallel_tests.js'
      - 'benchmark_v5_5_testunit1.js'
      - 'benchmark_v5_5_teacher.js'
      - 'benchmark_armx_preview.js'
      - 'benchmark_armx_browser.html'
      - 'benchmark_armx_browser_ci.js'
      - 'DEV_V5_5_TESTUNIT1.md'
      - '.github/workflows/v5-5-testunit1.yml'
  workflow_dispatch:

jobs:
  dev-testunit1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build compiled ARMX search
        env:
          STONEFISH_CC: clang
        run: node build_v5_5_kernel.cjs
      - name: Upload rebuilt native kernel
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-v55-native
          path: Stonefish_v5_5_native.js
          retention-days: 1
      - name: Commit rebuilt native kernel to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.HEAD_REF;
          const path = 'Stonefish_v5_5_native.js';
          const headers = {
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          const url = 'https://api.github.com/repos/' + repo + '/contents/' + path;
          const metaResponse = await fetch(url + '?ref=' + encodeURIComponent(branch), { headers });
          if (!metaResponse.ok) throw new Error('Could not read branch native file: ' + metaResponse.status);
          const meta = await metaResponse.json();
          const content = fs.readFileSync(path).toString('base64');
          const current = String(meta.content || '').replace(/\s/g, '');
          if (current === content) {
            console.log('Embedded native kernel already matches rebuilt output.');
            process.exit(0);
          }
          const writeResponse = await fetch(url, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: 'Rebuild embedded v5.5 native kernel',
              content,
              sha: meta.sha,
              branch,
            }),
          });
          if (!writeResponse.ok) {
            throw new Error('Could not commit rebuilt native kernel: ' + writeResponse.status + ' ' + await writeResponse.text());
          }
          const written = await writeResponse.json();
          console.log('Committed rebuilt kernel: ' + written.commit.sha);
          NODE
      - name: Syntax check ARMX-preview
        run: node --check ARMX-preview.js
      - name: Syntax check v5.5 native search
        run: node --check Stonefish_v5_5_native.js
      - name: Syntax check Refutation Guard
        run: node --check Stonefish_v5_5_refutation_guard.js
      - name: Syntax check v5.5 testunit1
        run: node --check Stonefish_v5_5_testunit1.js
      - name: Syntax check browser dev-test worker
        run: node --check test-worker.js
      - name: Syntax check parallel dev-test UI
        run: node --check Stonefish_parallel_tests.js
      - name: Syntax check v5.5 teacher benchmark
        run: node --check benchmark_v5_5_teacher.js
      - name: Syntax check ARMX-preview in-game diagnostics
        run: node --check benchmark_armx_preview.js
      - name: Syntax check browser ARMX benchmark runner
        run: node --check benchmark_armx_browser_ci.js
      - name: Verify native search and capture generation
        run: node benchmark_v5_5_native_contract.js
      - name: Verify opponent memory contracts
        run: node benchmark_armx_contract.js
      - name: Verify compiled helpers and JavaScript fallback parity
        run: node benchmark_v5_5_kernel_contract.js
      - name: Verify learned reply policy and native control parity
        run: node benchmark_armx_reply_policy.js
      - name: Run ARMX-preview in-game diagnostics
        env:
          ARMX_DIAG_GAMES: '8'
        run: node benchmark_armx_preview.js
      - name: Diagnose compiled ARMX parity
        run: node benchmark_armx_compiled_parity.js
      - name: Compare compiled ARMX with full fallback ARMX
        env:
          ARMX_H2H_GAMES: '40'
        run: node benchmark_armx_compiled_vs_current.js
      - name: Profile ARMX browser overhead
        env:
          ARMX_BROWSER_GAMES: '10'
          ARMX_BROWSER_MAX_TIME_RATIO: '99'
          ARMX_BROWSER_PROFILE: '1'
        run: node benchmark_armx_browser_ci.js
      - name: Measure ARMX versus No-ARMX in Chrome worker
        env:
          ARMX_BROWSER_GAMES: '40'
          ARMX_BROWSER_MAX_TIME_RATIO: '1.30'
        run: node benchmark_armx_browser_ci.js
      - name: Measure compiled ARMX versus No-ARMX
        env:
          ARMX_H2H_GAMES: '60'
          ARMX_MAX_TIME_RATIO: '1.25'
        run: node benchmark_armx_compiled_vs_noarmx.js
      - name: Smoke test the frozen ARMX strength baseline
        env:
          SAMPLES: '4'
          GAMES: '2'
          MATCHUP: 'armxVsBaseline'
        run: node benchmark_v5_5_testunit1.js
      - name: Run v5.5 dev benchmark
        env:
          SAMPLES: '20'
          GAMES: '8'
        run: node benchmark_v5_5_testunit1.js
