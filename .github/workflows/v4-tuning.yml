name: v4-tuning-king-protection-values
on:
  push:
    branches: ['v4-tuning-king-protection-values']
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match browser 1000-ply limit
        run: sed -i 's/max=500/max=1000/g; s/maxPlies = 500/maxPlies = 1000/g' tools/v4-tune.js
      - run: node tools/v4-king-protection-values.js
