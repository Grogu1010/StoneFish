name: v4-tuning-fourply-combo
on:
  push:
    branches: ['v4-tuning-fourply-combo']
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/v4-fourply-combo.js
