name: v4-lossdoctor
on:
  push:
    branches: ['v4-lossdoctor-work']
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/v4-lossdoctor.js
