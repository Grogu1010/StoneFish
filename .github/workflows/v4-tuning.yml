name: v4-tuning-samedepth-rep3-trace
on:
  push:
    branches: ['v4-tuning-samedepth-rep3-trace']
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/v4-samedepth-rep3-trace.js
